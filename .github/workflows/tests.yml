name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        # The suite is deliberately offline: every test runs against
        # fixtures captured from the live APIs or an in-memory SQLite
        # database, so CI never touches Polymarket or Kalshi.
        run: pytest -q

      - name: Check the CLI loads
        run: marketlens --help
