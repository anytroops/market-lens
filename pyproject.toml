[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.1.0"
description = "Prediction-market calibration and cross-platform divergence analysis (Polymarket vs Kalshi)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
marketlens = "marketlens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
